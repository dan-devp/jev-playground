name: jev-playground

services:
  backend:
    build: ./backend
    environment:
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:?TYPESAFE_API_KEY is missing - set it in .env or in your shell}
      SPRING_AI_TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-https://api.typesafe.ai}
      SPRING_AI_TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
    # Lets the backend reach a mock on the host (tools/mock-jev-server.py), also on Linux.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-5179}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
